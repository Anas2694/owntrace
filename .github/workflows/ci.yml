name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use supported Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        run: npm ci --prefix client

      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Lint client
        run: npm run lint

      - name: Build client
        run: npm run build

      - name: Check server syntax
        run: npm run check:syntax

      - name: Test server
        run: npm test

      - name: Smoke production runtime
        run: npm run smoke:production

      - name: Audit dependencies
        run: |
          npm audit --audit-level=moderate
          npm audit --prefix client --audit-level=moderate
          npm audit --prefix server --audit-level=moderate

      - name: Build production image
        run: docker build --tag owntrace:${{ github.sha }} .
